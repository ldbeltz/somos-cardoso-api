name: ci-main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets['SSH_PRIVATE_KEY'] }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DB_USER: ${{secrets.DB_USER }}
      DB_NAME: ${{secrets.DB_NAME }}
      DB_PASSWORD: ${{secrets.DB_PASSWORD }}
      DB_HOST: ${{secrets.DB_HOST }}
      DB_PORT: ${{secrets.DB_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set database configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${DB_USER:?Set the DB_USER secret}"
          : "${DB_NAME:?Set the DB_NAME secret}"
          : "${DB_PASSWORD:?Set the DB_PASSWORD secret}"
          : "${DB_HOST:?Set the DB_HOST secret}"
          : "${DB_PORT:?Set the DB_PORT secret}"
          sed -i \
            -e "s|^    url:.*|    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}|" \
            -e "s|^    username:.*|    username: ${DB_USER}|" \
            -e "s|^    password:.*|    password: '${DB_PASSWORD}'|" \
            src/main/resources/application.yaml

      - name: Build and validate before deployment
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --no-daemon
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-plain.jar' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$JAR_FILE"
          test -s "$JAR_FILE"
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_USER:?Set the USER secret}"
          : "${SSH_PRIVATE_KEY:?Set the SSH-KEY secret}"
          : "${SERVER_IP:?Set the SERVER secret}"
          : "${SSH_KNOWN_HOSTS:?Set the SSH_KNOWN_HOSTS secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload application jar
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$JAR_FILE" \
            "${SSH_USER}@${SERVER_IP}:/tmp/somoscardoso-deploy.jar"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SERVER_IP}" "bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${HOME}/apps/somos-cardoso-api"
          PID_FILE="${APP_DIR}/somoscardoso.pid"
          LOG_FILE="${APP_DIR}/somoscardoso.log"

          DEPLOYED_JAR="${APP_DIR}/somoscardoso.jar"
          mkdir -p "$APP_DIR"
          test -s /tmp/somoscardoso-deploy.jar
          mv /tmp/somoscardoso-deploy.jar "$DEPLOYED_JAR"

          if [[ -f "$PID_FILE" ]]; then
            OLD_PID="$(cat "$PID_FILE")"
            if [[ "$OLD_PID" =~ ^[0-9]+$ ]] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID"
              for _ in {1..30}; do
                kill -0 "$OLD_PID" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill -9 "$OLD_PID"
              fi
            fi
            rm -f "$PID_FILE"
          fi

          nohup java -jar "$DEPLOYED_JAR" > "$LOG_FILE" 2>&1 < /dev/null &
          APP_PID=$!
          echo "$APP_PID" > "$PID_FILE"

          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "Application failed to start; recent log output:" >&2
            tail -n 100 "$LOG_FILE" >&2 || true
            rm -f "$PID_FILE"
            exit 1
          fi
          echo "Application started with PID $APP_PID"
          echo "Flyway migrations, if any, are applied during startup."
          REMOTE

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
